name: resample assertion validation

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reset to upstream baseline
        run: git reset --hard a0bee58c9c564de977a2ece4134f40c50fa495b2
      - name: Install test environment
        run: python -m pip install -e '.[test]' ruff
      - name: Apply runtime-invariant fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/stcal/resample/resample.py')
          text = path.read_text()

          replacements = {
              '''        assert self._output_wcs is not None  # noqa: S101
        assert np.array_equiv(self._output_wcs.array_shape, self._output_array_shape)  # noqa: S101
        assert self._output_pixel_scale  # noqa: S101
''': '''        if self._output_wcs is None:
            raise RuntimeError("Output WCS is not initialized.")
        if not np.array_equiv(self._output_wcs.array_shape, self._output_array_shape):
            raise RuntimeError("Output WCS array shape changed after resampler initialization.")
        if not self._output_pixel_scale:
            raise RuntimeError("Output pixel scale is not initialized.")
''',
              '''        # TODO: do we need this to just raise a custom
        assert isinstance(model, dict)  # noqa: S101
''': '''        if not isinstance(model, dict):
            raise TypeError(f"Input model must be a dictionary, got {type(model).__name__}.")
''',
              '''        assert self._n_res_models  # noqa: S101
''': '''        if not self._n_res_models:
            raise RuntimeError("Cannot finalize time information before resampling any input models.")
''',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise RuntimeError(f'Expected source block not found:\n{old}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Validate
        run: |
          ruff check src/stcal/resample/resample.py --select S101
          python -m pytest -q tests/resample
      - name: Push validated branch
        if: success()
        run: |
          git config user.name 'Sylvester Kaczmarek'
          git config user.email '16242628+sylvesterkaczmarek@users.noreply.github.com'
          git checkout -B fix-resample-runtime-invariants
          git add src/stcal/resample/resample.py
          git commit -m 'Replace resample runtime asserts with exceptions'
          git push --force origin fix-resample-runtime-invariants

# Temporary fork-only validation workflow.
